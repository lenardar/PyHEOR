name: Publish to PyPI

# Publishing a reviewed GitHub Release starts the distribution pipeline.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import ast
          import os
          import pathlib
          import tomllib

          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          tag = os.environ['RELEASE_TAG']
          if tag != f'v{version}':
              raise SystemExit(f'Release tag {tag!r} must match package version v{version}')
          module = ast.parse(pathlib.Path('src/pyheor/__init__.py').read_text())
          source_version = next(
              ast.literal_eval(node.value)
              for node in module.body
              if isinstance(node, ast.Assign)
              and any(isinstance(target, ast.Name) and target.id == '__version__'
                      for target in node.targets)
          )
          if source_version != version:
              raise SystemExit('Package metadata and source versions must match')
          PY
      - name: Install build tools
        run: python -m pip install build twine pytest
      - name: Build and check distributions
        run: |
          python -m build
          python -m twine check --strict dist/*
      - name: Test the built wheel
        run: |
          python -m pip install dist/*.whl
          python -m pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pyheor/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      # PyPI trusts this workflow through OIDC; no stored API token is needed.
      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1

  release-assets:
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - name: Attach distributions to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/*.whl dist/*.tar.gz --clobber
